appId: com.ioc.react-web
productName: IOC-decentralization
directories:
  output: release
  buildResources: build
icon: src/assets/icon.ico
files:
  - dist/**/*
  - electron/**/*
publish:
  provider: github
  owner: Khunglongtocxu
  repo: IOC_decentralization
  releaseType: release
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: IOC App
