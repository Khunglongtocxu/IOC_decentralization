appId: com.ioc.react-web
productName: IOC-decentralization
directories:
  output: release
  buildResources: build
icon: src/assets/icon.ico
files:
  - dist/**/*
  - electron/**/*
publish:
  provider: github
  owner: Khunglongtocxu
  repo: IOC_decentralization
  releaseType: release
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  # One-click: không hiện wizard (chọn user/thư mục) → cài đặt/cập nhật chạy thẳng rồi mở app
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: IOC App
